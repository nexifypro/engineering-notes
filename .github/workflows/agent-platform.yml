name: agent-platform

on:
  push:
    paths: ["agent-platform/**", ".github/workflows/agent-platform.yml"]
  pull_request:
    paths: ["agent-platform/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -q
